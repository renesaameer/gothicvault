    <div id="root"></div>

      try {
        window.__app_booted__ = false;

          if (window.__app_booted__) return;
          try {
            var k = "__app_boot_recovery__";
            var already = false;
            try { already = sessionStorage.getItem(k) === "1"; } catch(e) {}

              try { sessionStorage.setItem(k, "1"); } catch(e) {}
              location.reload();
              return;
            }
          } catch(e) {}
          var r = document.getElementById("root");
          if (r && !r.hasChildNodes()) {

          }
        }, 5000);
      } catch(e) {}
